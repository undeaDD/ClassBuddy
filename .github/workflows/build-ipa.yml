name: Build IPA

# Builds an unsigned .ipa for sideloading (AltStore / SideStore re-sign it on install).
# Runs only on demand:
# - "Run workflow" button (Actions tab): build + upload the .ipa as a workflow artifact
# - release tag "v*" (e.g. v1.0.0): additionally attach the .ipa to a GitHub release
# Actions are pinned to commit SHAs (supply-chain safety); Dependabot keeps them updated.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Image mit Xcode 27 (das App-Icon ist eine Icon-Composer-Datei aus Xcode 27, ältere actool-Versionen stürzen ab).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Newest installed Xcode on the image (incl. betas).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest

      - name: Show toolchain
        run: |
          xcodebuild -version
          ls -d /Applications/Xcode*.app

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ClassBuddy.xcodeproj \
            -target ClassBuddy \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning:|BUILD" || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/ClassBuddy.app Payload/
          zip -qry ClassBuddy.ipa Payload
          ls -lh ClassBuddy.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ClassBuddy-ipa
          path: ClassBuddy.ipa
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: ClassBuddy.ipa
          generate_release_notes: true
