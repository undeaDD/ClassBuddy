name: Build IPA

# Builds an unsigned .ipa for sideloading (AltStore / SideStore re-sign it on install).
# Runs only on demand:
# - "Run workflow" button (Actions tab): build + upload the .ipa as a workflow artifact
# - release tag "v*" (e.g. v1.0.0): additionally attach the .ipa to a GitHub release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Newest installed Xcode (incl. betas): the app icon is an Icon Composer file
      # from Xcode 27, older actool versions crash on it.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show toolchain
        run: |
          xcodebuild -version
          ls -d /Applications/Xcode*.app

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ClassBuddy.xcodeproj \
            -target ClassBuddy \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning:|BUILD" || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/ClassBuddy.app Payload/
          zip -qry ClassBuddy.ipa Payload
          ls -lh ClassBuddy.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClassBuddy-ipa
          path: ClassBuddy.ipa
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ClassBuddy.ipa
          generate_release_notes: true
