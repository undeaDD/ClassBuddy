name: Build IPA

# Builds an unsigned .ipa for sideloading (AltStore / SideStore re-sign it on install).
# - every push / PR: build + upload the .ipa as a workflow artifact
# - tags "v*" (e.g. v1.0.0): additionally attach the .ipa to a GitHub release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ClassBuddy.xcodeproj \
            -target ClassBuddy \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning:|BUILD" || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/ClassBuddy.app Payload/
          zip -qry ClassBuddy.ipa Payload
          ls -lh ClassBuddy.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassBuddy-ipa
          path: ClassBuddy.ipa
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ClassBuddy.ipa
          generate_release_notes: true
