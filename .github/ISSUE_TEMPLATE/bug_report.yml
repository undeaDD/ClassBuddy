name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please never attach real student data** (names, grades, notes) – use dummy data or blur screenshots.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → Version (e.g. 1.0.0 (1))
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & iPadOS version
      placeholder: iPad Air 11" (M3), iPadOS 26.1
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed via
      options:
        - AltStore
        - SideStore
        - Xcode (built from source)
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / logs
      description: Crash logs, screenshots (without real personal data).
