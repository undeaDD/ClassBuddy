name: ClassBuddy
options:
  bundleIdPrefix: de.drees
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: de
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClassBuddy:
    type: application
    platform: iOS
    sources:
      - ClassBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.drees.ClassBuddy
        ASSETCATALOG_COMPILER_APPICON_NAME: ""  # → "AppIcon", sobald AppIcon.icon (Icon Composer) im Projekt liegt
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ClassBuddy
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID schützt die Schülerdaten und blendet sensible Informationen wieder ein."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
