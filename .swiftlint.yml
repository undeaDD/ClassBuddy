# SwiftLint – Ziel: 0 Fehler (erzwungen per pre-commit Hook, siehe .githooks/).
included:
  - ClassBuddy
  - ClassBuddyTests
  - ClassBuddyWidgets
excluded:
  - build
  - ClassBuddy/Resources

disabled_rules:
  # Nachgestellte Kommas sind hier Stil (saubere Diffs in Listen).
  - trailing_comma

opt_in_rules:
  - empty_count
  - first_where
  - contains_over_filter_count
  - sorted_first_last
  - toggle_bool
  - unused_optional_binding
  - vertical_whitespace_closing_braces

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

identifier_name:
  excluded: [id, x, y, to, ok]

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100

nesting:
  type_level: 2
